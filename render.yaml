services:
  - type: web
    name: RONN_CORE
    runtime: python
    repo: https://github.com/rezvo85-cmd/Private
    branch: main
    plan: free
    region: oregon
    rootDir: RONN_CORE_RENDER_DEPLOY_V1/_ronn
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RONN_PUBLIC_MODE
        value: "true"
      - key: CLOUD_API_BASE
        value: https://api.groq.com/openai/v1
      - key: CLOUD_API_KEY
        sync: false
      - key: RONN_CORE_TOKEN
        sync: false
      - key: RONN_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: RONN_MEMORY
          property: connectionString

databases:
  - name: RONN_MEMORY
    plan: free
    region: oregon
    postgresMajorVersion: "18"
