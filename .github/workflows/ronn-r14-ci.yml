name: RONN R23 All 11 Checks

on:
  push:
    branches: [main]
    paths:
      - "RONN_CORE_RENDER_DEPLOY_V1/_ronn/**"
      - ".github/workflows/ronn-r14-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "RONN_CORE_RENDER_DEPLOY_V1/_ronn/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/_ronn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile *.py

      - name: Run intelligence benchmarks
        run: |
          python - <<'PY'
          from r11_benchmarks import run_r11_benchmarks
          from r12_benchmarks import run_r12_benchmarks
          from r13_benchmarks import run_r13_benchmarks
          from r14_benchmarks import run_r14_benchmarks
          from r15_eval_lab import run as run_r15_eval
          from r22_benchmarks import run as run_r22_eval
          from r23_eval_lab import run as run_r23_eval

          suites = {
              "R11": run_r11_benchmarks(),
              "R12": run_r12_benchmarks(),
              "R13": run_r13_benchmarks(),
              "R14": run_r14_benchmarks(),
              "R15-R19": run_r15_eval(),
              "R22-LEAN": run_r22_eval(),
              "R23-ALL-11": run_r23_eval(),
          }
          failed = False
          for name, result in suites.items():
              print(name, result)
              if result.get("score", 0) < 100:
                  failed = True
          if failed:
              raise SystemExit("One or more RONN benchmark suites failed.")
          PY

      - name: Import RONN app
        env:
          RONN_PUBLIC_MODE: "false"
        run: |
          python - <<'PY'
          import app
          import crawl_service
          print("imported:", app.BUILD_ID)
          print("reader import: ok (Crawl4AI remains lazy until /crawl)")
          assert crawl_service._CRAWL4AI_COMPONENTS is None
          assert any(
              getattr(route, "path", "") == "/" and "HEAD" in (getattr(route, "methods", set()) or set())
              for route in app.app.routes
          )
          assert any(
              getattr(route, "path", "") == "/" and "HEAD" in (getattr(route, "methods", set()) or set())
              for route in crawl_service.app.routes
          )
          assert app.BUILD_ID == "RONN-COGNITIVE-OS-2026-R23-ALL-11"
          r23 = app.r23_eval_run()
          print("r23:", r23)
          assert r23.get("all_11_ready") is True
          assert r23.get("score") == 100.0
          PY

      - name: Attachment budget smoke
        run: |
          python - <<'PY'
          import math
          from pathlib import Path
          import app

          mib=1024*1024
          document_raw=25*mib
          document_b64=4*math.ceil(document_raw/3)
          assert app.MAX_BODY_BYTES >= 40*mib
          assert document_b64 < app.MAX_BODY_BYTES

          js=Path("static/app.js").read_text(encoding="utf-8")
          assert "MAX_IMAGE_BYTES=20*1024*1024" in js
          assert "MAX_DOCUMENT_BYTES=25*1024*1024" in js
          assert "MAX_CHAT_IMAGE_RAW_BYTES=22*1024*1024" in js
          assert 'bytes:file.size' in js
          assert 'Images together must stay under 22 MB.' in js
          print("attachment budget: ok")
          PY

      - name: Rate limiter hardening smoke
        run: |
          python - <<'PY'
          import time
          from collections import deque
          from starlette.requests import Request
          import app

          def request(xff):
              return Request({
                  "type":"http",
                  "http_version":"1.1",
                  "method":"POST",
                  "scheme":"https",
                  "path":"/api/v1/chat",
                  "raw_path":b"/api/v1/chat",
                  "query_string":b"",
                  "headers":[(b"x-forwarded-for",xff.encode())],
                  "client":("10.0.0.10",12345),
                  "server":("testserver",443),
              })

          # Ignore spoofed left-side prefixes and use the rightmost public hop.
          assert app.client_key(request("1.1.1.1, 8.8.8.8")) == "8.8.8.8"
          # Skip private proxy hops while walking back toward the real public client.
          assert app.client_key(request("1.1.1.1, 10.0.0.2")) == "1.1.1.1"

          now=time.time()
          app._rate_hits.clear()
          for i in range(app.RATE_LIMIT_MAX_KEYS + 250):
              app._rate_hits[f"stale-{i}"]=deque([now-120])
          app._rate_hits["live"]=deque([now])
          app._prune_rate_hits(now)
          assert "live" in app._rate_hits
          assert len(app._rate_hits) <= app.RATE_LIMIT_MAX_KEYS

          # Overflow cleanup must evict oldest active identities, not grow forever.
          app._rate_hits.clear()
          for i in range(app.RATE_LIMIT_MAX_KEYS + 50):
              app._rate_hits[f"k-{i}"]=deque([now+i/100000.0])
          app._prune_rate_hits(now)
          assert len(app._rate_hits) == app.RATE_LIMIT_MAX_KEYS
          print("rate limiter hardening: ok")
          PY

      - name: Core auth boundary smoke
        run: |
          python - <<'PY'
          import os
          from starlette.requests import Request
          import app
          from ecosystem_store import create_owner_session, revoke_owner_session

          old = os.environ.get("RONN_CORE_TOKEN")
          os.environ["RONN_CORE_TOKEN"] = "ci-core-secret"

          def request(path, headers=None):
              pairs=[]
              for k,v in (headers or {}).items():
                  pairs.append((k.lower().encode(), str(v).encode()))
              return Request({
                  "type":"http",
                  "http_version":"1.1",
                  "method":"GET",
                  "scheme":"https",
                  "path":path,
                  "raw_path":path.encode(),
                  "query_string":b"",
                  "headers":pairs,
                  "client":("127.0.0.1",12345),
                  "server":("testserver",443),
              })

          try:
              forged=request("/api/memory",{
                  "x-ronn-account":"ronn_primary",
                  "x-ronn-client":"client123",
              })
              assert app.owner_id(forged) == "client123"
              assert app._legacy_private_route("/api/memory") is True
              assert app._legacy_private_route("/api/chat") is True
              assert app._legacy_private_route("/api/status") is False
              assert app._legacy_private_route("/api/v1/chat") is False
              assert app._legacy_owner_authorized(forged) is False

              bearer=request("/api/memory",{
                  "x-ronn-account":"ronn_primary",
                  "x-ronn-client":"client123",
                  "authorization":"Bearer ci-core-secret",
              })
              assert app.owner_id(bearer) == "ronn_primary"
              assert app._legacy_owner_authorized(bearer) is True

              unlock=request("/api/v1/owner/unlock",{
                  "x-ronn-account":"ronn_primary",
                  "x-ronn-client":"client123",
              })
              assert app.owner_id(unlock) == "ronn_primary"

              token,_ = create_owner_session("ronn_primary","client123","device123",1)
              try:
                  session=request("/api/memory",{
                      "x-ronn-account":"ronn_primary",
                      "x-ronn-client":"client123",
                      "cookie":"ronn_op="+token,
                  })
                  assert app.owner_id(session) == "ronn_primary"
                  assert app._legacy_owner_authorized(session) is True
              finally:
                  revoke_owner_session(token)
          finally:
              if old is None:
                  os.environ.pop("RONN_CORE_TOKEN",None)
              else:
                  os.environ["RONN_CORE_TOKEN"]=old

          print("core auth boundary: ok")
          PY

      - name: Reader resilience smoke
        run: |
          python - <<'PY'
          import asyncio
          from fastapi import HTTPException
          import crawl_service
          import r20_web_tools

          assert crawl_service._CRAWL4AI_COMPONENTS is None
          parsed = crawl_service._parse_html(
              "<html><head><title>RONN Reader</title></head>"
              "<body><script>ignore me</script><h1>Hello</h1>"
              "<a href='/docs'>Docs</a></body></html>",
              "https://example.com/start",
              5000,
          )
          assert parsed["title"] == "RONN Reader"
          assert "Hello" in parsed["markdown"]
          assert "ignore me" not in parsed["markdown"]
          assert parsed["links"][0]["href"] == "https://example.com/docs"

          class FakeResponse:
              status_code = 200
              headers = {"Content-Type": "text/html; charset=utf-8"}
              encoding = "utf-8"
              def iter_content(self, chunk_size=65536):
                  yield b"<html><head><title>Fallback</title></head><body>Recovered page</body></html>"
              def raise_for_status(self):
                  return None
              def close(self):
                  return None

          class FakeSession:
              def get(self, *args, **kwargs):
                  return FakeResponse()

          original_session = crawl_service.requests.Session
          original_public_url = crawl_service._public_url
          crawl_service.requests.Session = lambda: FakeSession()
          crawl_service._public_url = lambda url: url
          try:
              fallback = crawl_service._http_fallback("https://example.com", 5000)
          finally:
              crawl_service.requests.Session = original_session
              crawl_service._public_url = original_public_url

          assert fallback["ok"] is True
          assert fallback["reader"] == "http-fallback"
          assert fallback["title"] == "Fallback"
          assert "Recovered page" in fallback["markdown"]

          # Auth must reject invalid callers while the production no-browser fast
          # path must go directly to the known-working HTTP fallback.
          old_token = crawl_service.READER_TOKEN
          old_browser = crawl_service.BROWSER_ENABLED
          old_fallback = crawl_service._http_fallback
          old_public = crawl_service._public_url
          crawl_service.READER_TOKEN = "test-reader-secret"
          crawl_service.BROWSER_ENABLED = False
          crawl_service._public_url = lambda url: url
          crawl_service._http_fallback = lambda url, max_chars: {
              "ok": True,
              "url": url,
              "title": "Fast fallback",
              "markdown": "reader fast path",
              "links": [],
              "reader": "http-fallback",
          }
          try:
              try:
                  asyncio.run(crawl_service.crawl(
                      crawl_service.CrawlBody(url="https://example.com", max_chars=5000),
                      "wrong-secret",
                  ))
                  raise AssertionError("reader accepted an invalid service token")
              except HTTPException as exc:
                  assert exc.status_code == 401

              fast = asyncio.run(crawl_service.crawl(
                  crawl_service.CrawlBody(url="https://example.com", max_chars=5000),
                  "test-reader-secret",
              ))
              assert fast["reader"] == "http-fallback"
              assert fast["browser_error"] == "disabled"
              assert crawl_service._CRAWL4AI_COMPONENTS is None
          finally:
              crawl_service.READER_TOKEN = old_token
              crawl_service.BROWSER_ENABLED = old_browser
              crawl_service._http_fallback = old_fallback
              crawl_service._public_url = old_public

          # Core must attach the same token on /crawl requests.
          captured = {}
          class CoreFakeResponse:
              def raise_for_status(self):
                  return None
              def json(self):
                  return {
                      "url": "https://example.com",
                      "title": "Authenticated",
                      "markdown": "ok",
                  }
          old_post = r20_web_tools.requests.post
          old_core_token = r20_web_tools.READER_TOKEN
          def fake_post(*args, **kwargs):
              captured["headers"] = dict(kwargs.get("headers") or {})
              return CoreFakeResponse()
          r20_web_tools.requests.post = fake_post
          r20_web_tools.READER_TOKEN = "test-reader-secret"
          try:
              result = r20_web_tools.read("https://example.com", 5000)
          finally:
              r20_web_tools.requests.post = old_post
              r20_web_tools.READER_TOKEN = old_core_token
          assert result["title"] == "Authenticated"
          assert captured["headers"]["X-RONN-Reader-Token"] == "test-reader-secret"

          print("reader resilience/auth/fast-path: ok")
          PY

      - name: Check browser JavaScript
        run: |
          node --check static/app.js
          node --check static/service-worker.js

      - name: Validate web manifest
        run: |
          python - <<'PY'
          import json
          with open("static/manifest.webmanifest", "r", encoding="utf-8") as f:
              json.load(f)
          print("manifest: ok")
          PY

      - name: Check for accidentally committed API keys
        run: |
          if grep -R -n -E '(sk-or-v1-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,})' .             --exclude-dir=data --exclude='*.db' --exclude='*.sqlite' ; then
            echo "Potential API key found in repository files."
            exit 1
          fi
          echo "secret-pattern scan: ok"
