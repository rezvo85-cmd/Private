              ecosystem_store._stable_vault_key=lambda:(stable,"ci")
              ecosystem_store._read_local_vault_key=lambda:legacy
              ecosystem_store._migrate_vault_ciphertexts=lambda old,new:False
              os.environ["RENDER"]="true"
              os.environ.pop("RENDER_SERVICE_ID",None)
              try:
                  ecosystem_store._vault_key()
                  raise AssertionError("Render silently kept a legacy Vault key")
              except RuntimeError as exc:
                  assert "migration failed" in str(exc).lower()
          finally:
              ecosystem_store._stable_vault_key=old_stable
              ecosystem_store._read_local_vault_key=old_local
              ecosystem_store._migrate_vault_ciphertexts=old_migrate
              if old_render is None:
                  os.environ.pop("RENDER",None)
              else:
                  os.environ["RENDER"]=old_render
              if old_render_id is None:
                  os.environ.pop("RENDER_SERVICE_ID",None)
              else:
                  os.environ["RENDER_SERVICE_ID"]=old_render_id

          print("storage limits / Vault migration fail-safe: ok")
          PY

