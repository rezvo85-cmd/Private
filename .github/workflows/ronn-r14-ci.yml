              def __enter__(self): return self
              def __exit__(self,*args): return False
              def execute(self,sql,params=()):
                  captured.append(tuple(params))
              def fetchall(self): return []
          class FakeDB:
              def __enter__(self): return self
              def __exit__(self,*args): return False
              def cursor(self): return FakeCursor()

