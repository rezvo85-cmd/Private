                  pending_row=c.execute("SELECT status FROM handoffs WHERE id=?",(pending,)).fetchone()
              assert claimed_count == 2
              assert pending_row and pending_row["status"] == "pending"

              # Owner-session rows are bounded independently of unlock throttling.
              # Revoked signed-session records must survive until expiry so a
              # redeploy cannot accidentally make a revoked token valid again.
              with eco._db() as c:
                  now=1000.0
                  for i in range(5):
