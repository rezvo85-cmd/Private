name: RONN R23 All 11 Checks

on:
  push:
    branches: [main]
    paths:
      - "RONN_CORE_RENDER_DEPLOY_V1/_ronn/**"
      - ".github/workflows/ronn-r14-ci.yml"
      - "render.yaml"
  pull_request:
    branches: [main]
    paths:
      - "RONN_CORE_RENDER_DEPLOY_V1/_ronn/**"
      - ".github/workflows/ronn-r14-ci.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/_ronn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile *.py

      - name: Run intelligence benchmarks
        run: |
          python - <<'PY'
          from r11_benchmarks import run_r11_benchmarks
          from r12_benchmarks import run_r12_benchmarks
          from r13_benchmarks import run_r13_benchmarks
          from r14_benchmarks import run_r14_benchmarks
          from r15_eval_lab import run as run_r15_eval
          from r22_benchmarks import run as run_r22_eval
          from r23_eval_lab import run as run_r23_eval

          suites = {
              "R11": run_r11_benchmarks(),
              "R12": run_r12_benchmarks(),
              "R13": run_r13_benchmarks(),
              "R14": run_r14_benchmarks(),
              "R15-R19": run_r15_eval(),
              "R22-LEAN": run_r22_eval(),
              "R23-ALL-11": run_r23_eval(),
          }
          failed = False
          for name, result in suites.items():
              print(name, result)
              if result.get("score", 0) < 100:
                  failed = True
          if failed:
              raise SystemExit("One or more RONN benchmark suites failed.")
          PY

      - name: Import RONN app
        env:
          RONN_PUBLIC_MODE: "false"
        run: |
          python - <<'PY'
          import app
          import crawl_service
          print("imported:", app.BUILD_ID)
          print("reader import: ok (Crawl4AI remains lazy until /crawl)")
          assert crawl_service._CRAWL4AI_COMPONENTS is None
          assert any(
              getattr(route, "path", "") == "/" and "HEAD" in (getattr(route, "methods", set()) or set())
              for route in app.app.routes
          )
          assert any(
              getattr(route, "path", "") == "/" and "HEAD" in (getattr(route, "methods", set()) or set())
              for route in crawl_service.app.routes
          )
          assert app.BUILD_ID == "RONN-COGNITIVE-OS-2026-R23-ALL-11"
          r23 = app.r23_eval_run()
          print("r23:", r23)
          assert r23.get("all_11_ready") is True
          assert r23.get("score") == 100.0
          PY

      - name: Integrity and health truthfulness smoke
        run: |
          python - <<'PY'
          import json
          import app

          integrity=app.verify_package_integrity()
          print("integrity:",integrity)
          assert integrity["verified"] is True, integrity

          healthy=app.health()
          assert isinstance(healthy,dict)
          assert healthy["ok"] is True
          assert healthy["integrity_ok"] is True

          original=app.verify_package_integrity
          try:
              app.verify_package_integrity=lambda: {
                  "verified":False,
                  "reason":"forced-ci-failure",
                  "checked":1,
                  "mismatches":[{"file":"forced","state":"modified"}],
              }
              unhealthy=app.health()
              assert getattr(unhealthy,"status_code",None) == 503
              body=json.loads(unhealthy.body.decode("utf-8"))
              assert body["ok"] is False
              assert body["integrity_ok"] is False
          finally:
              app.verify_package_integrity=original

          print("integrity/health truthfulness: ok")
          PY

      - name: Render database binding smoke
        run: |
          python - <<'PY'
          from pathlib import Path

          text=Path("../../render.yaml").read_text(encoding="utf-8")
          compact=" ".join(line.strip() for line in text.splitlines() if line.strip())

          assert "name: RONN_CORE" in text
          assert "key: DATABASE_URL" in text
          assert "fromDatabase:" in text
          assert "name: RONN_MEMORY" in text
          assert "property: connectionString" in text
          assert "postgresql://" not in text
          assert "postgres://" not in text
          assert "password:" not in text
          assert "RONN_MEMORY" in compact
          print("render database binding: ok")
          PY

      - name: Production release gate runtime smoke
        env:
          RENDER: "true"
          DATABASE_URL: "configured-for-ci"
        run: |
          python - <<'PY'
          import os
          import r21_release_gate

          healthy=r21_release_gate.run()
          print("healthy gate:",healthy)
          checks={x["name"]:x for x in healthy["checks"]}
          assert healthy["ok"] is True
          assert checks["database_runtime_binding"]["passed"] is True
          assert checks["external_capability_boundaries"]["passed"] is True

          os.environ["DATABASE_URL"]=""
          missing=r21_release_gate.run()
          print("missing-db gate:",missing)
          checks={x["name"]:x for x in missing["checks"]}
          assert missing["ok"] is False
          assert checks["database_runtime_binding"]["passed"] is False
          print("production runtime release gate: ok")
          PY

      - name: Attachment budget smoke
        run: |
          python - <<'PY'
          import math
          from pathlib import Path
          import app

          mib=1024*1024
          document_raw=25*mib
          document_b64=4*math.ceil(document_raw/3)
          assert app.MAX_BODY_BYTES >= 40*mib
          assert document_b64 < app.MAX_BODY_BYTES

          js=Path("static/app.js").read_text(encoding="utf-8")
          assert "MAX_IMAGE_BYTES=20*1024*1024" in js
          assert "MAX_DOCUMENT_BYTES=25*1024*1024" in js
          assert "MAX_CHAT_IMAGE_RAW_BYTES=22*1024*1024" in js
          assert 'bytes:file.size' in js
          assert 'Images together must stay under 22 MB.' in js
          print("attachment budget: ok")
          PY

      - name: Rate limiter hardening smoke
        run: |
          python - <<'PY'
          import time
          from collections import deque
          from starlette.requests import Request
          import app

          def request(xff):
              return Request({
                  "type":"http",
                  "http_version":"1.1",
                  "method":"POST",
                  "scheme":"https",
                  "path":"/api/v1/chat",
                  "raw_path":b"/api/v1/chat",
                  "query_string":b"",
                  "headers":[(b"x-forwarded-for",xff.encode())],
                  "client":("10.0.0.10",12345),
                  "server":("testserver",443),
              })

          # Ignore spoofed left-side prefixes and use the rightmost public hop.
          assert app.client_key(request("1.1.1.1, 8.8.8.8")) == "8.8.8.8"
          # Skip private proxy hops while walking back toward the real public client.
          assert app.client_key(request("1.1.1.1, 10.0.0.2")) == "1.1.1.1"

          now=time.time()
          app._rate_hits.clear()
          for i in range(app.RATE_LIMIT_MAX_KEYS + 250):
              app._rate_hits[f"stale-{i}"]=deque([now-120])
          app._rate_hits["live"]=deque([now])
          app._prune_rate_hits(now)
          assert "live" in app._rate_hits
          assert len(app._rate_hits) <= app.RATE_LIMIT_MAX_KEYS

          # Overflow cleanup must evict oldest active identities, not grow forever.
          app._rate_hits.clear()
          for i in range(app.RATE_LIMIT_MAX_KEYS + 50):
              app._rate_hits[f"k-{i}"]=deque([now+i/100000.0])
          app._prune_rate_hits(now)
          assert len(app._rate_hits) == app.RATE_LIMIT_MAX_KEYS

          # Owner/recovery reconnect attempts are always throttled, even when
          # normal chat runs in private mode. Keep their bucket isolated.
          app._rate_hits.clear()
          auth_key="auth:8.8.8.8"
          for _ in range(app.OWNER_UNLOCK_RATE_LIMIT_PER_MINUTE):
              assert app._consume_rate_limit(auth_key,app.OWNER_UNLOCK_RATE_LIMIT_PER_MINUTE,now) is True
          assert app._consume_rate_limit(auth_key,app.OWNER_UNLOCK_RATE_LIMIT_PER_MINUTE,now) is False
          assert app._consume_rate_limit("expensive:8.8.8.8",1,now) is True
          print("rate limiter hardening: ok")
          PY

      - name: Runtime state guard smoke
        run: |
          python - <<'PY'
          import time
          import app
          import r20_web_tools

          # Expired Studio plans must disappear even if no newer plan was made,
          # and a burst of pending plans must stay bounded.
          now=time.time()
          with app._studio_plan_lock:
              app._studio_plans.clear()
              app._studio_plans["expired"]={
                  "owner":"ci","plan":{},"task":"x",
                  "created_at":now-app.STUDIO_PLAN_TTL_SECONDS-1,
              }
              for i in range(app.STUDIO_PLAN_MAX_PENDING+25):
                  app._studio_plans[f"p-{i}"]={
                      "owner":"ci","plan":{},"task":"x",
                      "created_at":now-(app.STUDIO_PLAN_MAX_PENDING+25-i)/1000.0,
                  }
              app._prune_studio_plans_locked(now)
              assert "expired" not in app._studio_plans
              assert len(app._studio_plans) == app.STUDIO_PLAN_MAX_PENDING
              assert "p-0" not in app._studio_plans
              assert f"p-{app.STUDIO_PLAN_MAX_PENDING+24}" in app._studio_plans
              app._studio_plans.clear()

          # Search health must not call a reachable-but-unusable 4xx service healthy.
          original_get=r20_web_tools.requests.get
          class FakeResponse:
              def __init__(self,status,data=None):
                  self.status_code=status
                  self.ok=200 <= status < 400
                  self._data=data or {}
              def json(self):
                  return self._data

          try:
              def bad_search(url,*args,**kwargs):
                  if url.endswith("/health"):
                      return FakeResponse(200,{"ok":True})
                  return FakeResponse(403)
              r20_web_tools.requests.get=bad_search
              r20_web_tools._HEALTH_CACHE["at"]=0
              r20_web_tools._HEALTH_CACHE["value"]={}
              unhealthy=r20_web_tools.status(force=True)
              assert unhealthy["searxng"] is False
              assert unhealthy["crawl4ai"] is True

              def good_services(url,*args,**kwargs):
                  if url.endswith("/health"):
                      return FakeResponse(200,{"ok":True})
                  return FakeResponse(200)
              r20_web_tools.requests.get=good_services
              healthy=r20_web_tools.status(force=True)
              assert healthy["searxng"] is True
              assert healthy["crawl4ai"] is True
          finally:
              r20_web_tools.requests.get=original_get
              r20_web_tools._HEALTH_CACHE["at"]=0
              r20_web_tools._HEALTH_CACHE["value"]={}

          print("runtime state guards: ok")
          PY

      - name: Vault durability and SQLite backup smoke
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3
          import tempfile
          from pathlib import Path

          import ecosystem_store as store

          old_db=store.DB
          old_data=store.DATA
          old_backups=store.BACKUPS
          old_vault_key=store.VAULT_KEY_FILE
          old_max=store.MAX_BACKUPS
          old_render=os.environ.get("RENDER")
          old_render_id=os.environ.get("RENDER_SERVICE_ID")
          old_master=os.environ.get("RONN_VAULT_MASTER_KEY")
          old_session=os.environ.get("RONN_SESSION_SIGNING_KEY")
          old_core=os.environ.get("RONN_CORE_TOKEN")

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              data=root/"data"
              backups=data/"backups"
              data.mkdir()
              backups.mkdir()
              store.DATA=data
              store.DB=data/"ecosystem_v1.sqlite3"
              store.BACKUPS=backups
              store.VAULT_KEY_FILE=data/"vault.key"
              store.MAX_BACKUPS=3

              try:
                  # Render Vault must derive a stable, separate Fernet key from
                  # an existing stable server secret.
                  os.environ["RENDER"]="true"
                  os.environ.pop("RENDER_SERVICE_ID",None)
                  os.environ.pop("RONN_VAULT_MASTER_KEY",None)
                  os.environ.pop("RONN_SESSION_SIGNING_KEY",None)
                  os.environ["RONN_CORE_TOKEN"]="ci-stable-server-secret"

                  first=store._vault_key()
                  assert store.vault_key_status()["durable"] is True
                  assert store.vault_key_status()["source"] == "server_secret_derived"
                  item=store.vault_put("ci-owner","Durable note","persists across key-file loss")
                  assert store.vault_get("ci-owner",item["id"])["text"] == "persists across key-file loss"

                  # Simulate an ephemeral filesystem loss/redeploy. The derived
                  # key must be identical without relying on vault.key.
                  store.VAULT_KEY_FILE.unlink(missing_ok=True)
                  second=store._vault_key()
                  assert first == second
                  assert store.vault_get("ci-owner",item["id"])["text"] == "persists across key-file loss"

                  # On Render with no stable secret, refuse a disposable Vault key.
                  store.VAULT_KEY_FILE.unlink(missing_ok=True)
                  os.environ.pop("RONN_CORE_TOKEN",None)
                  unavailable=store.vault_key_status()
                  assert unavailable["available"] is False
                  assert unavailable["durable"] is False
                  try:
                      store._vault_key()
                      raise AssertionError("Render accepted an ephemeral Vault key")
                  except RuntimeError:
                      pass

                  # Restore a stable server secret for the remaining DB work.
                  os.environ["RONN_CORE_TOKEN"]="ci-stable-server-secret"
                  store._vault_key()

                  # Keep a WAL writer open with committed rows, then verify that
                  # backup_all captures the complete SQLite state via sqlite backup.
                  conn=sqlite3.connect(store.DB)
                  conn.execute("PRAGMA journal_mode=WAL")
                  conn.execute("CREATE TABLE IF NOT EXISTS ci_rows(id INTEGER PRIMARY KEY, value TEXT)")
                  conn.execute("INSERT INTO ci_rows(value) VALUES('wal-visible')")
                  conn.commit()

                  first_backup=store.backup_all("ci")
                  assert first_backup["consistent_sqlite_snapshot"] is True
                  assert not first_backup["errors"]
                  backup_db=Path(first_backup["folder"])/store.DB.name
                  with sqlite3.connect(backup_db) as snap:
                      assert snap.execute("SELECT value FROM ci_rows").fetchone()[0] == "wal-visible"
                  conn.close()

                  # Backup history must stay bounded and names must not collide.
                  names={Path(first_backup["folder"]).name}
                  for _ in range(5):
                      b=store.backup_all("ci")
                      names.add(Path(b["folder"]).name)
                  assert len(names) == 6
                  folders=[x for x in store.BACKUPS.iterdir() if x.is_dir()]
                  assert len(folders) == store.MAX_BACKUPS
                  listed=store.list_backups(999)
                  assert len(listed) == store.MAX_BACKUPS
                  assert all(x.get("consistent_sqlite_snapshot") is True for x in listed)
              finally:
                  store.DB=old_db
                  store.DATA=old_data
                  store.BACKUPS=old_backups
                  store.VAULT_KEY_FILE=old_vault_key
                  store.MAX_BACKUPS=old_max

                  for key,value in (
                      ("RENDER",old_render),
                      ("RENDER_SERVICE_ID",old_render_id),
                      ("RONN_VAULT_MASTER_KEY",old_master),
                      ("RONN_SESSION_SIGNING_KEY",old_session),
                      ("RONN_CORE_TOKEN",old_core),
                  ):
                      if value is None:
                          os.environ.pop(key,None)
                      else:
                          os.environ[key]=value

          print("vault durability / SQLite backup consistency: ok")
          PY

      - name: Training and monitor retention smoke
        run: |
          python - <<'PY'
          import tempfile
          import time
          from pathlib import Path

          import r18_monitor as monitor
          import r19_training_data as training

          # Training candidates: stale/unrated responses and positive examples
          # must stay bounded instead of growing forever.
          old_training_db=training.DB
          old_ttl=training.PENDING_TTL_SECONDS
          old_pending=training.MAX_PENDING_PER_OWNER
          old_examples=training.MAX_EXAMPLES_PER_OWNER
          with tempfile.TemporaryDirectory() as td:
              training.DB=Path(td)/"training.db"
              training.PENDING_TTL_SECONDS=10
              training.MAX_PENDING_PER_OWNER=3
              training.MAX_EXAMPLES_PER_OWNER=4
              now=int(time.time())

              with training._db() as c:
                  c.execute(
                      "INSERT INTO pending VALUES(?,?,?,?,?,?,?)",
                      ("expired","owner","general","old","old","model",now-100),
                  )
                  c.commit()

              for i in range(6):
                  assert training.stage(f"req-{i}","owner",f"prompt {i}",f"response {i}") is True
              s=training.stats("owner")
              assert s["pending_feedback"] <= 3
              assert training.pending_example("expired") is None

              with training._db() as c:
                  c.execute(
                      "INSERT INTO pending VALUES(?,?,?,?,?,?,?)",
                      ("expired-promote","owner","general","old","old","model",now-100),
                  )
                  c.commit()
              assert training.promote("expired-promote") is None

              for i in range(7):
                  training.add("owner",f"p{i}",f"r{i}")
              s=training.stats("owner")
              assert s["examples"] <= 4
              assert s["max_pending_per_owner"] == 3
              assert s["max_examples_per_owner"] == 4

          training.DB=old_training_db
          training.PENDING_TTL_SECONDS=old_ttl
          training.MAX_PENDING_PER_OWNER=old_pending
          training.MAX_EXAMPLES_PER_OWNER=old_examples

          # Monitor watches and alert history must also stay bounded, while
          # duplicate URLs reuse the existing watch and owners can delete watches.
          old_monitor_db=monitor.DB
          old_watch_limit=monitor.MAX_WATCHES_PER_OWNER
          old_alert_limit=monitor.MAX_ALERTS_PER_OWNER
          with tempfile.TemporaryDirectory() as td:
              monitor.DB=Path(td)/"monitor.db"
              monitor.MAX_WATCHES_PER_OWNER=3
              monitor.MAX_ALERTS_PER_OWNER=4

              first=monitor.add("owner","One","https://example.com/one",900)
              duplicate=monitor.add("owner","Duplicate","https://example.com/one",900)
              assert duplicate["id"] == first["id"]
              monitor.add("owner","Two","https://example.com/two",900)
              monitor.add("owner","Three","https://example.com/three",900)
              try:
                  monitor.add("owner","Four","https://example.com/four",900)
                  raise AssertionError("monitor watch limit was bypassed")
              except ValueError:
                  pass
              assert len(monitor.list_watches("owner")) == 3

              watch=monitor.get(first["id"])
              with monitor._db() as c:
                  for i in range(8):
                      monitor._alert(c,watch,f"alert-{i}")
                  c.commit()
                  count=c.execute("SELECT COUNT(*) n FROM alerts WHERE owner='owner'").fetchone()["n"]
              assert count == 4
              assert monitor.remove("other-owner",first["id"]) is False
              assert monitor.remove("owner",first["id"]) is True
              assert monitor.get(first["id"]) is None
              assert monitor.status()["max_alerts_per_owner"] == 4

          monitor.DB=old_monitor_db
          monitor.MAX_WATCHES_PER_OWNER=old_watch_limit
          monitor.MAX_ALERTS_PER_OWNER=old_alert_limit

          print("training/monitor retention bounds: ok")
          PY

      - name: Cloud snapshot and task retention smoke
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          import time
          from pathlib import Path
          from types import SimpleNamespace

          import r15_cloud_brain as cloud
          import snapshot_engine as snaps
          import task_engine as tasks

          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              db=root/"state.sqlite3"
              conn=sqlite3.connect(db)
              conn.execute("PRAGMA journal_mode=WAL")
              conn.execute("CREATE TABLE t(v INTEGER)")
              conn.execute("INSERT INTO t VALUES(42)")
              conn.commit()

              snap_path=root/"snapshots"/"owner"/"project"/"s1.json"
              snap_path.parent.mkdir(parents=True)
              snap_path.write_text('{"ok":true}',encoding="utf-8")
              backup_path=root/"backups"/"old"/"copy.sqlite3"
              backup_path.parent.mkdir(parents=True)
              backup_path.write_bytes(b"do-not-cloud-sync")
              (root/"vault.key").write_text("secret",encoding="utf-8")

              names={p.relative_to(root).as_posix() for p in cloud._iter_sync_files(root)}
              assert "state.sqlite3" in names
              assert "snapshots/owner/project/s1.json" in names
              assert "backups/old/copy.sqlite3" not in names
              assert "vault.key" not in names
              assert cloud._safe_relative_name("../escape.db") is None
              assert cloud._safe_relative_name("/absolute.db") is None
              assert cloud._safe_relative_name("backups/x.db") is None

              stable=cloud._stable_bytes(db)
              copy=root/"stable.sqlite3"
              copy.write_bytes(stable)
              with sqlite3.connect(copy) as check:
                  assert check.execute("SELECT v FROM t").fetchone()[0] == 42
              conn.close()

          class Result:
              def __init__(self,rows): self.rows=list(rows)
              def fetchall(self): return list(self.rows)

          class FakeCloud:
              def __init__(self,rows=None):
                  self.rows=list(rows or [])
                  self.calls=[]
              def execute(self,sql,params=()):
                  self.calls.append((sql,params))
                  if sql.strip().upper().startswith("SELECT"):
                      return Result(self.rows)
                  return Result([])

          old_cloud_max=cloud._MAX_SNAPSHOTS_PER_PROJECT
          cloud._MAX_SNAPSHOTS_PER_PROJECT=2
          try:
              fake=FakeCloud([
                  ("snapshots/o/p/a.json",1),
                  ("snapshots/o/p/b.json",2),
                  ("snapshots/o/p/c.json",3),
                  ("snapshots/o/q/a.json",1),
              ])
              assert cloud._prune_cloud_snapshot_rows(fake) == 1
              assert any("DELETE FROM ronn_cloud_files" in sql for sql,_ in fake.calls)

              events=FakeCloud()
              cloud._prune_events(events,"owner",1_000_000)
              deletes=[x for x in events.calls if x[0].strip().upper().startswith("DELETE")]
              assert len(deletes) == 2
              assert any(cloud._MAX_EVENTS_PER_OWNER in params for _,params in deletes)
          finally:
              cloud._MAX_SNAPSHOTS_PER_PROJECT=old_cloud_max

          with tempfile.TemporaryDirectory() as td:
              old_root,old_max=snaps.ROOT,snaps.MAX_SNAPSHOTS_PER_PROJECT
              snaps.ROOT=Path(td)/"snapshots"
              snaps.ROOT.mkdir(parents=True)
              snaps.MAX_SNAPSHOTS_PER_PROJECT=3
              try:
                  for i in range(5):
                      snaps.create_snapshot(
                          "owner","project",
                          [SimpleNamespace(name="file.txt",content=f"value-{i}")],
                          f"checkpoint-{i}",
                      )
                      time.sleep(0.003)
                  assert len(snaps.list_snapshots("owner","project",99)) == 3
                  assert len(list((snaps.ROOT/"owner"/"project").glob("*.json"))) == 3
              finally:
                  snaps.ROOT,snaps.MAX_SNAPSHOTS_PER_PROJECT=old_root,old_max

          with tempfile.TemporaryDirectory() as td:
              old_db=tasks.DB
              old_tasks=tasks.MAX_TASKS_PER_OWNER
              old_cp=tasks.MAX_CHECKPOINTS_PER_TASK
              tasks.DB=Path(td)/"tasks.sqlite3"
              tasks.MAX_TASKS_PER_OWNER=3
              tasks.MAX_CHECKPOINTS_PER_TASK=3
              try:
                  for i in range(5):
                      tid=f"task-{i}"
                      tasks.start_task(tid,"owner","project",f"prompt-{i}","general",2,"sig",{})
                      for j in range(5):
                          tasks.checkpoint(tid,f"phase-{j}","complete",str(j))
                      tasks.finish_task(tid,"complete")
                  with tasks._db() as c:
                      task_count=c.execute("SELECT COUNT(*) FROM tasks WHERE owner='owner'").fetchone()[0]
                      max_cp=c.execute(
                          "SELECT COALESCE(MAX(n),0) FROM (SELECT COUNT(*) n FROM checkpoints GROUP BY task_id)"
                      ).fetchone()[0]
                  assert task_count == 3
                  assert max_cp <= 3
              finally:
                  tasks.DB=old_db
                  tasks.MAX_TASKS_PER_OWNER=old_tasks
