              "ronn-docling-smoke.pptx",
              payload("application/vnd.openxmlformats-officedocument.presentationml.presentation",buf.getvalue()),
          )
          assert pptx["meta"]["backend"] == "docling"
          assert "RONN Presentation Smoke" in pptx["text"]

          # Strict base64 and Office decompression guards must fail before parsers.
          try:
              extract_document("bad.txt","data:text/plain;base64,%%%not-base64%%%")
