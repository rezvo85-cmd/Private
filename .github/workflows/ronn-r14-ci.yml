              if old_groq_key is None: os.environ.pop("GROQ_API_KEY",None)
              else: os.environ["GROQ_API_KEY"]=old_groq_key

          for unsafe in (
              "http://127.0.0.1",
              "http://localhost",
              "http://[::1]",
              "https://user:pass@example.com/path",
              "https://example.com:8443/path",
              "http://example.com:8080/path",
          ):
              try:
                  browser_use._public_http_url(unsafe)
                  raise AssertionError("unsafe Browser Use target accepted: "+unsafe)
              except ValueError:
                  pass

          base={"difficulty":3,"profile":"knowledge","followup":False}
          interactive=capability_plan(
              base,
              "Open https://example.com and click the More information link",
              history=[],file_names=[],has_images=False,has_project=False,agent_mode=True,
          )
          assert interactive["browser_interactive"] is True
          assert interactive["computer_requested"] is False
          assert interactive["agent_runtime"] is True

          computer=capability_plan(
              base,
              "Use my computer and inspect my screen",
              history=[],file_names=[],has_images=False,has_project=False,agent_mode=True,
          )
          assert computer["computer_requested"] is True
          assert computer["browser_interactive"] is False

          from r23_task_graph import build_task_graph, reconcile_task_graph
          browser_decision={
              "difficulty":3,
              "profile":"knowledge",
              "verify":False,
              "needs_live":False,
              "capabilities":interactive,
              "requirement_contract":{},
          }
          graph=build_task_graph(
              "Open https://example.com and click the More information link",
              browser_decision,
          )
          rows={x["id"]:x for x in graph["nodes"]}
          assert graph["active"] is True
          assert "interact_browser" in rows
          assert rows["interact_browser"]["kind"] == "browser"

          success_run={
              "planned":["browser_automation"],
              "executed":["browser_automation"],
              "browser_automation":{"ok":True,"blocked":False},
              "evidence_contract":{
                  "interactive_browser_verified":True,
                  "retrieval":{},
                  "runtime_execution":{},
              },
              "evidence_sufficiency":{"sufficient":True,"gaps":[]},
          }
          success_graph=reconcile_task_graph(graph,success_run,browser_decision)
          success_rows={x["id"]:x for x in success_graph["nodes"]}
          assert success_rows["interact_browser"]["state"] == "complete"

          blocked_run={
              "planned":["browser_automation"],
              "executed":[],
              "browser_automation":{"ok":False,"blocked":True,"result":"BLOCKED: final submit remains"},
              "evidence_contract":{
                  "interactive_browser_verified":False,
                  "retrieval":{},
                  "runtime_execution":{},
              },
              "evidence_sufficiency":{
                  "sufficient":False,
                  "gaps":["interactive_browser_execution"],
              },
          }
          blocked_graph=reconcile_task_graph(graph,blocked_run,browser_decision)
          blocked_rows={x["id"]:x for x in blocked_graph["nodes"]}
          assert blocked_rows["interact_browser"]["state"] == "failed"
          assert blocked_graph["dead_end"] is True
          assert blocked_graph["replan_reason"] == "unrecoverable_browser_action"
          assert blocked_graph["recovery_attempted"] is False

          # A failed interactive task also fails the generic explicit-URL gate.
          # Browser failure must win over research recovery so RONN never retries
          # a stateful click/fill/submit flow as if it were just missing a page read.
          mixed_gap_run=dict(blocked_run)
          mixed_gap_run["evidence_sufficiency"]={
              "sufficient":False,
              "gaps":["explicit_url_read","interactive_browser_execution"],
          }
          mixed_graph=reconcile_task_graph(graph,mixed_gap_run,browser_decision)
          assert mixed_graph["dead_end"] is True
          assert mixed_graph["replan_reason"] == "unrecoverable_browser_action"
          assert mixed_graph.get("recovery_kind","") == ""
          assert not any(str(x.get("id","")).startswith("recover_") for x in mixed_graph["nodes"])

          # Interactive browser tasks must not also run the legacy text-browser
          # fetch path. Keep the two execution modes mutually exclusive.
          import r23_agent_runtime as runtime_mod
          old_extract=runtime_mod.extract_urls
          old_collect=runtime_mod.collect_pages
          old_browser_exec=runtime_mod.browser_use_execute
          calls={"collect":0,"interactive":0}
          runtime_mod.extract_urls=lambda message:["https://example.com"]
          runtime_mod.collect_pages=lambda urls: calls.__setitem__("collect",calls["collect"]+1) or []
          runtime_mod.browser_use_execute=lambda message,depth="smart": (
              calls.__setitem__("interactive",calls["interactive"]+1)
              or {"ok":True,"urls":["https://example.com"],"result":"clicked","actions":["click"],"steps":1}
          )
          try:
              decision={
                  "needs_live":False,
                  "capabilities":{
                      "agent_runtime":True,
                      "browser_url":True,
                      "browser_interactive":True,
                      "retrieval":{},
                  },
              }
              run=runtime_mod.execute("ci","browser-overlap","Open https://example.com and click More",[],decision)
          finally:
              runtime_mod.extract_urls=old_extract
              runtime_mod.collect_pages=old_collect
              runtime_mod.browser_use_execute=old_browser_exec
          assert calls["collect"] == 0
          assert calls["interactive"] == 1
          assert "browser_automation" in run["executed"]
          assert "browser" not in run["executed"]
          browser_sources=[x for x in run["sources"] if x.get("kind")=="browser_automation"]
          assert browser_sources
          assert browser_sources[0].get("read") is False
          assert browser_sources[0].get("interacted") is True

          brain=Path("r23_brain.py").read_text(encoding="utf-8").lower()
          assert "browser_use" not in brain
          runtime=agent_status()
          assert runtime["version"] == "R23-AGENT-3"
          assert runtime["browser_use"]["scope"] == "bounded_browser_executor"
          print("Browser Use R23 ownership/lazy-load/safety boundary: ok")
          PY

      - name: Visible answer protocol leak regression
        run: |
          python - <<'PY'
          import app
          from intelligence_core import answer_audit, internal_payload_signal

          screenshot_payload='{"queries": ["Jordan 12 white green new release 2024 2025", "Jordan 12 white green sneakers latest"]}'
          normal_question="Mannn I wanted these new jays like I needed some Jordan 12 the white and green new ones man check that out for me right quick boss"

          assert app.looks_like_internal_tool_payload(screenshot_payload, normal_question) is True
          assert app.looks_like_internal_tool_payload(
              screenshot_payload,
              "Give me JSON with the search queries only",
          ) is False

          signal=internal_payload_signal(screenshot_payload)
          assert signal["detected"] is True
          assert signal["reason"] == "search_planner_json"

          audit=answer_audit(
              normal_question,
              screenshot_payload,
              profile="research",
              runtime_verified=False,
              evidence_mode="live",
          )
          assert audit["internal_payload"]["detected"] is True
          assert any("Internal tool/search planning payload" in x for x in audit["warnings"])
          print("server visible-answer planner leak guard: ok")

          # Reproduce the reported failure on a NON-live route. The backend must
          # hold planner JSON before sending even one visible token, then recover
          # through retrieval + normal synthesis.
          class FakeStream:
              ok=True
              status_code=200
              text=""
              def __enter__(self): return self
              def __exit__(self,*args): return False
              def iter_lines(self):
                  import json as _json
                  chunk={"choices":[{"delta":{"content":screenshot_payload}}]}
                  yield ("data: "+_json.dumps(chunk)).encode("utf-8")
                  yield b"data: [DONE]"

          old_research=app.r23_research_run
          old_nonstream=app.nonstream_with_fallback
          old_save=app.save_message
          try:
              app.r23_research_run=lambda *args,**kwargs:{
                  "ok":True,
                  "evidence":"READ PAGE: Jordan sneaker evidence",
                  "source_count":1,
                  "read_count":1,
                  "snippet_only_count":0,
              }
              app.nonstream_with_fallback=lambda *args,**kwargs:(
                  "I found the sneaker information and synthesized a normal answer.",
                  app.SMART_MODEL,
              )
              app.save_message=lambda *args,**kwargs: None

              events=list(app.stream_response(
                  FakeStream(),
                  "ci-owner",
                  normal_question,
                  "knowledge",
                  app.SMART_MODEL,
                  profile="knowledge",
                  retry_messages=[
                      {"role":"system","content":"Answer the user normally."},
                      {"role":"user","content":normal_question},
                  ],
              ))
          finally:
              app.r23_research_run=old_research
              app.nonstream_with_fallback=old_nonstream
              app.save_message=old_save

          visible=[]
          for row in events:
              try:
                  obj=__import__("json").loads(row)
              except Exception:
                  continue
              if obj.get("token"):
                  visible.append(obj["token"])
          joined="".join(visible)
          assert screenshot_payload not in joined, joined
          assert '"queries"' not in joined.lower(), joined
          assert "synthesized a normal answer" in joined, joined

          root=app.index()
          assert "no-store" in str(root.headers.get("cache-control") or "").lower()
          print("non-live streamed planner leak guard + root cache control: ok")
          PY

          node <<'JS'
          const fs=require("fs");
          const src=fs.readFileSync("static/app.js","utf8");
          const start=src.indexOf("function looksInternalToolPayload");
          const end=src.indexOf("\nfunction inline",start);
          if(start<0||end<0)throw new Error("looksInternalToolPayload function not found");
          eval(src.slice(start,end));

          const payload='{"queries": ["Jordan 12 white green new release 2024 2025", "Jordan 12 white green sneakers latest"]}';
          const question="Mannn I wanted these new jays like I needed some Jordan 12 the white and green new ones man check that out for me right quick boss";
          if(!looksInternalToolPayload(payload,question))throw new Error("planner JSON leak was not blocked");
          if(looksInternalToolPayload(payload,"Give me JSON with the search queries only"))throw new Error("explicit JSON request was blocked");
          console.log("client visible-answer planner leak guard: ok");

          const index=fs.readFileSync("static/index.html","utf8");
          const sw=fs.readFileSync("static/service-worker.js","utf8");
          const version="RONN-R23-PLAN-GUARD2";
          if(!index.includes("/static/app.js?v="+version))throw new Error("index app.js cache-bust version mismatch");
          if(!index.includes("/static/style.css?v="+version))throw new Error("index style cache-bust version mismatch");
          if(!sw.includes("/static/app.js?v="+version))throw new Error("service worker asset version mismatch");
          if(!sw.includes("ronn-assets-r23-plan-guard2"))throw new Error("service worker cache name mismatch");
          if(!src.includes("/service-worker.js?v="+version))throw new Error("service worker registration version mismatch");
          console.log("web asset version/cache bust consistency: ok");
          JS

      - name: Check browser JavaScript
        run: |
          node --check static/app.js
          node --check static/service-worker.js

      - name: Validate web manifest
        run: |
          python - <<'PY'
          import json
          with open("static/manifest.webmanifest", "r", encoding="utf-8") as f:
              json.load(f)
          print("manifest: ok")
          PY

      - name: Check for accidentally committed API keys
        run: |
          if grep -R -n -E '(sk-or-v1-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,})' .             --exclude-dir=data --exclude='*.db' --exclude='*.sqlite' ; then
            echo "Potential API key found in repository files."
            exit 1
          fi
          echo "secret-pattern scan: ok"

  external_browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/_ronn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Core plus Browser Use
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r browser_requirements.txt

      - name: Browser Use compatibility smoke
        run: |
          python - <<'PY'
          import importlib.metadata

          import r23_browser_use_adapter as adapter
          from browser_use import Agent, Browser, BrowserProfile, ChatGroq

          version=importlib.metadata.version("browser-use")
          print("browser-use version:",version)
          assert version == "0.13.10"

          st=adapter.status()
          print("adapter status:",st)
          assert st["installed"] is True
          assert st["scope"] == "bounded_browser_executor"
          assert st["lazy_loaded"] is True

          # Constructor-only smoke: no network, LLM call, or browser process.
          assert adapter.DEFAULT_MODEL == "openai/gpt-oss-120b"
          assert st["model"] == "openai/gpt-oss-120b"

          llm=ChatGroq(
              model="openai/gpt-oss-120b",
              api_key="ci-not-used",
              temperature=0.0,
              max_retries=1,
          )
          profile=BrowserProfile(
              headless=True,
              allowed_domains=["example.com"],
              block_ip_addresses=True,
              keep_alive=False,
              enable_default_extensions=False,
          )
          browser=Browser(browser_profile=profile)
          assert llm.provider == "groq"
          assert browser.browser_profile.block_ip_addresses is True
          assert browser.browser_profile.enable_default_extensions is False
          assert "example.com" in browser.browser_profile.allowed_domains

          agent=Agent(
              task="Open https://example.com and inspect the page",
              llm=llm,
              browser=browser,
              use_vision=False,
              use_thinking=False,
              max_actions_per_step=3,
              max_failures=3,
              final_response_after_failure=False,
              max_history_items=8,
              generate_gif=False,
              directly_open_url=True,
          )
          assert agent.settings.use_vision is False

          # The combined dependency environment must still import the actual RONN
          # application and pass the R23 benchmark. This catches transitive package
          # downgrades that a Browser Use-only constructor smoke would miss.
          import app
          assert app.BUILD_ID == "RONN-COGNITIVE-OS-2026-R23-ALL-11"
          r23=app.r23_eval_run()
          assert r23.get("all_11_ready") is True
          assert r23.get("score") == 100.0

          # Importing the adapter must never pull Browser Use into the main brain.
          import r23_brain
          assert "browser_use" not in open("r23_brain.py",encoding="utf-8").read().lower()
          print("openai-agents version:",importlib.metadata.version("openai-agents"))
          print("Browser Use dependency/API/full-app compatibility: ok")
          PY

  external_eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/_ronn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DeepEval only
        run: |
          python -m pip install --upgrade pip
          pip install -r eval_requirements.txt

      - name: Run DeepEval integration smoke
        run: |
          python - <<'PY'
          from r23_deepeval_adapter import status, run_non_llm_smoke

          st=status()
          result=run_non_llm_smoke()
          print("status:",st)
          print("result:",result)
          assert st["installed"] is True
          assert st["scope"] == "evaluation_only"
          assert st["production_chat_dependency"] is False
          assert result["ok"] is True
          assert result["score"] == 100.0
          PY
