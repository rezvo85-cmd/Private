name: RONN Mobile iOS

on:
  push:
    branches: [main]
    paths:
      - "RONN_CORE_RENDER_DEPLOY_V1/mobile/**"
      - ".github/workflows/ronn-mobile-ios.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx expo-doctor
      - run: npx expo export --platform ios --output-dir dist

  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build RONN iOS Simulator app
        run: |
          cd ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$WORKSPACE" ]; then
            echo "No Xcode workspace generated"
            exit 1
          fi
          if ! xcodebuild -list -workspace "$WORKSPACE" | grep -qE '^[[:space:]]*RONN[[:space:]]*$'; then
            echo "RONN app scheme not found"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme RONN \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        run: |
          APP="$(find ios/build/Build/Products -type d -name 'RONN.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "RONN.app was not produced"
            find ios/build/Build/Products -maxdepth 4 -type d -name '*.app' -print || true
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" RONN-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RONN-iOS-Simulator
          path: RONN_CORE_RENDER_DEPLOY_V1/mobile/RONN-iOS-Simulator.zip
          if-no-files-found: error
