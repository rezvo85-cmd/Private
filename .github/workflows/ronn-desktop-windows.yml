name: RONN Desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "ronn-desktop-v*"
  pull_request:
    branches: [main]
    paths:
      - "RONN_CORE_RENDER_DEPLOY_V1/desktop/**"
      - "RONN_CORE_RENDER_DEPLOY_V1/roblox_bridge/**"
      - "RONN_CORE_RENDER_DEPLOY_V1/roblox_toolchain/**"
      - ".github/workflows/ronn-desktop-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: RONN-Windows-Installer
          path: RONN_CORE_RENDER_DEPLOY_V1/desktop/release/RONN-Setup-*.exe
          if-no-files-found: error

      - name: Publish tagged desktop release
        if: startsWith(github.ref, 'refs/tags/ronn-desktop-v')
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
