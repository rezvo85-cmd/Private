name: RONN Mobile Android

on:
  push:
    branches: [main]
    paths:
      - "RONN_CORE_RENDER_DEPLOY_V1/mobile/**"
      - ".github/workflows/ronn-mobile-android.yml"
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RONN_CORE_RENDER_DEPLOY_V1/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - run: npx expo-doctor
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Package APK
        run: |
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "RONN Android APK was not produced"
            exit 1
          fi
          cp "$APK" RONN-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RONN-Android
          path: RONN_CORE_RENDER_DEPLOY_V1/mobile/RONN-Android.apk
          if-no-files-found: error
