services:
  - type: web
    name: ronn-core
    runtime: python
    rootDir: _ronn
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: RONN_PUBLIC_MODE
        value: "true"
      - key: CLOUD_API_BASE
        value: https://api.groq.com/openai/v1
      - key: CLOUD_API_KEY
        sync: false
      - key: RONN_CORE_TOKEN
        sync: false
      - key: RONN_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: RONN_MEMORY
          property: connectionString

databases:
  - name: RONN_MEMORY
    plan: free
    region: oregon
    postgresMajorVersion: "18"
